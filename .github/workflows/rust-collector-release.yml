name: Rust collector preparation

# Publication remains disabled until the separately authorized P8 handoff.
# Private signing is separately selected and environment-approved; no public release is created.
on:
  workflow_dispatch:
    inputs:
      signing_packet_sha256:
        description: Exact private RC signing packet digest; empty runs the rehearsal
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-collector-release-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protection:
    if: github.repository == 'musutrade/Harness-Gate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require existing protected environment before requesting approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=tools/release python3 - <<'PY'
          import os
          import collector_release_policy as policy
          client = policy.core.GitHubClient('https://api.github.com', policy.assets.REPOSITORY, os.environ['GH_TOKEN'])
          policy.protected_environment(client.get_json('/repos/' + policy.assets.REPOSITORY + '/environments/' + policy.ENVIRONMENT))
          PY
  dry-run:
    needs: protection
    if: inputs.signing_packet_sha256 == '' && github.repository == 'musutrade/Harness-Gate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: rust-collector-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Exercise delivery negatives and lifecycle
        run: python3 -m unittest discover -s tools/release/tests -v
      - name: Rehearse signed asset verification without publication
        run: python3 tools/release/collector_dry_run.py --output target/collector-release-dry-run
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: collector-release-dry-run-${{ github.run_id }}
          path: target/collector-release-dry-run
          if-no-files-found: error
          retention-days: 90

  sign-private-candidate:
    needs: protection
    if: inputs.signing_packet_sha256 != '' && github.repository == 'musutrade/Harness-Gate' && github.ref == 'refs/heads/main'
    environment: rust-collector-release
    runs-on:
      group: harness-gate-rust-collector-release
      labels: rust-collector-release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKET: ${{ vars.COLLECTOR_SIGNING_PACKET }}
      PACKET_SHA256: ${{ inputs.signing_packet_sha256 }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify private candidate before accessing the signing key
        run: |
          python3 tools/release/sign_collector_candidate.py preflight \
            --packet "$PACKET" --packet-sha256 "$PACKET_SHA256" --source "$SOURCE_SHA"
      - name: Sign locally for installation acceptance without public distribution
        shell: bash
        env:
          COLLECTOR_RSA_PRIVATE_KEY: ${{ secrets.COLLECTOR_RSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$COLLECTOR_RSA_PRIVATE_KEY" > "$key"
          unset COLLECTOR_RSA_PRIVATE_KEY
          python3 tools/release/sign_collector_candidate.py sign \
            --packet "$PACKET" --packet-sha256 "$PACKET_SHA256" --source "$SOURCE_SHA" --private-key "$key"
