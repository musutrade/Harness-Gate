name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: test
          profiles: 'test,dev;default'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked

      - name: Verify generated configuration schema
        run: |
          cargo run --manifest-path tools/harness-gate/Cargo.toml -- schema export
          git diff --exit-code -- schema/flow.schema.json

  test-cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: test
          profiles: 'test;default'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked --no-fail-fast

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit --deny warnings
        working-directory: tools/harness-gate

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/harness-gate/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: clippy
          profiles: 'dev,test;all-features'

      - name: Run clippy
        run: cargo clippy --manifest-path tools/harness-gate/Cargo.toml --locked --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: release
          profiles: 'release;default'

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: harness-gate-ubuntu-latest
          # Informational output only; no quality, release or performance consumer.
          path: ${{ env.CARGO_TARGET_DIR }}/release/harness-gate
          if-no-files-found: error

  build-cross-platform:
    name: Build (${{ matrix.os }})
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: release
          profiles: 'release;default'

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --release

  coverage:
    name: Code Coverage
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: tarpaulin
          profiles: 'instrumented;default'
          cache-target: 'false'

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked --force

      - name: Generate coverage
        # The full CLI corpus spawns Rust subprocesses through Python. LLVM
        # instrumentation avoids ptrace overhead while retaining those tests.
        run: cargo tarpaulin --manifest-path tools/harness-gate/Cargo.toml --locked --engine llvm --timeout 300 --out Xml --output-dir "$GITHUB_WORKSPACE/coverage"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  quality-coverage:
    name: Quality Coverage and Critical Paths
    runs-on: ubuntu-latest
    outputs:
      manifest-sha256: ${{ steps.seal.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality
          profiles: 'isolated-instrumented;default'
          cache-target: 'false'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-llvm-cov

      - name: Collect and require fresh coverage, risk and matrix evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 tools/quality/ci_quality.py collect \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/candidate

      - name: Seal immutable quality evidence
        id: seal
        run: python3 tools/quality/ci_artifact.py seal --root target/quality/candidate

      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            target/quality/candidate
            !target/quality/candidate/build
            !target/quality/candidate/snapshots
          if-no-files-found: warn

  quality-generic-shadow:
    name: Generic Quality Shadow
    # Advisory only: never add this job to quality-required's dependencies.
    if: ${{ always() }}
    needs: [quality-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download this run's retained Rust candidate
        uses: actions/download-artifact@v6
        with:
          name: quality-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/quality/candidate

      - name: Verify artifact identity and hashes before consumption
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.quality-coverage.outputs.manifest-sha256 }}
        run: |
          python3 tools/quality/ci_artifact.py verify --root target/quality/candidate \
            --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --output target/quality/artifact-validation.json

      - name: Project and compare retained evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 tools/quality/rust_reference.py \
            --candidate target/quality/candidate/candidate.json \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" \
            --output target/quality/generic-shadow

      - name: Upload generic projection and compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-generic-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/quality/generic-shadow/*.json
            target/quality/artifact-validation.json
          if-no-files-found: error

  quality-contracts:
    name: Quality CLI Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: contracts
          profiles: 'dev;default'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run CLI contract snapshots
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python tools/quality/contracts.py --output target/quality/contracts.json
          else
            python tools/quality/contracts.py --output target/quality/contracts.json --structured
          fi

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-contracts-ubuntu-latest-${{ github.run_id }}
          path: |
            target/quality/contracts.json
            tools/quality/snapshots/contracts.json
          if-no-files-found: warn

  quality-contracts-cross-platform:
    name: Quality CLI Contracts (${{ matrix.os }})
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: contracts
          profiles: 'dev;default'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run CLI contract snapshots
        shell: bash
        run: python tools/quality/contracts.py --output target/quality/contracts.json --structured

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-contracts-${{ matrix.os }}-${{ github.run_id }}
          path: |
            target/quality/contracts.json
            tools/quality/snapshots/contracts.json
          if-no-files-found: warn

  quality-baseline:
    name: Quality Performance Baseline
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: performance
          profiles: 'release-small,test;default;cold'
          cache-target: 'false'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install cargo-nextest
        uses: ./.github/actions/install-ci-tool
        with:
          tool: cargo-nextest

      - name: Capture benchmark and size baseline
        run: python tools/quality/benchmarks.py --output target/quality/benchmarks.json --samples 5

      - name: Upload baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-baseline-${{ matrix.os }}-${{ github.run_id }}
          path: target/quality
          if-no-files-found: warn

  docs-consistency:
    name: Documentation Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: docs
          profiles: 'dev;default'

      - name: Check documentation, examples, and schema
        run: python3 tools/quality/docs_consistency.py --output target/quality/docs-consistency.json

      - name: Upload documentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: docs-consistency-${{ github.run_id }}
          path: target/quality/docs-consistency.json
          if-no-files-found: warn

  release-contracts:
    name: Release Governance Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run release policy and inventory contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tools/release/tests -v
          bash tools/release/tests/test_install.sh

  quality-scripts:
    name: Quality Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust coverage tools for measurement contract tests
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Configure Cargo state
        uses: ./.github/actions/cargo-state
        with:
          class: quality-scripts
          profiles: 'fixture-owned'
          cache-target: 'false'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Test and compile quality scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tools/quality/tests -v
          python3 -m py_compile tools/quality/*.py tools/quality/tests/*.py

  quality-required:
    name: Required Quality Aggregate
    if: ${{ always() }}
    # Keep this check name stable because it is required by the main ruleset.
    # Evaluation only: no product compilation, tests, coverage/risk collection,
    # or heavy Rust tool setup. The step allowlist is tested in test_ci_topology.py.
    # PRs and pushes require coverage, risk and isolated traceability evidence.
    # Full macOS/Windows tests are required on PRs and pushes. Additional
    # cross-platform builds/contracts and performance collection are push-only.
    needs:
      [test, test-cross-platform, security-audit, fmt, clippy, build, build-cross-platform,
       coverage, quality-coverage, quality-contracts, quality-contracts-cross-platform,
       quality-baseline, docs-consistency, release-contracts, quality-scripts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Require every quality gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/quality/ci_quality.py aggregate
