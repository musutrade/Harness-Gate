name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/harness-gate/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Run tests
        run: cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked

      - name: Verify generated configuration schema
        run: |
          cargo run --manifest-path tools/harness-gate/Cargo.toml -- schema export
          git diff --exit-code -- schema/flow.schema.json

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force

      - name: Run security audit
        run: cargo audit --deny warnings
        working-directory: tools/harness-gate

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/harness-gate/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --manifest-path tools/harness-gate/Cargo.toml --locked --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: harness-gate-${{ matrix.os }}
          path: |
            tools/harness-gate/target/release/harness-gate
            tools/harness-gate/target/release/harness-gate.exe
          if-no-files-found: ignore

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/harness-gate/target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked --force

      - name: Generate coverage
        run: cargo tarpaulin --manifest-path tools/harness-gate/Cargo.toml --out Xml --output-dir coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: tools/harness-gate/coverage/cobertura.xml
          fail_ci_if_error: false

  quality-coverage:
    name: Quality Coverage and Critical Paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest and cargo-llvm-cov
        run: |
          cargo install cargo-nextest --locked --force
          cargo install cargo-llvm-cov --locked --version 0.9.0 --force

      - name: Generate coverage evidence
        run: python3 tools/quality/coverage.py --output target/quality/coverage.json

      - name: Capture structured test evidence
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: "1"
        run: |
          mkdir -p target/quality
          cargo nextest run --manifest-path tools/harness-gate/Cargo.toml --locked --no-fail-fast \
            --message-format libtest-json-plus --message-format-version 0.1 \
            > target/quality/nextest.jsonl

      - name: Evaluate critical-path matrix
        run: |
          python3 tools/quality/critical_paths.py \
            --evidence target/quality/nextest.jsonl \
            --coverage target/quality/coverage.json \
            --output target/quality/critical-paths.json

      - name: Upload quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-coverage-${{ github.run_id }}
          path: target/quality
          if-no-files-found: warn

  quality-contracts:
    name: Quality CLI Contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run CLI contract snapshots
        run: python tools/quality/contracts.py --output target/quality/contracts.json ${{ runner.os == 'Linux' && '' || '--structured' }}

      - name: Upload contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-contracts-${{ matrix.os }}-${{ github.run_id }}
          path: |
            target/quality/contracts.json
            tools/quality/snapshots/contracts.json
          if-no-files-found: warn

  quality-baseline:
    name: Quality Performance Baseline
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --force

      - name: Capture benchmark and size baseline
        run: python tools/quality/benchmarks.py --output target/quality/benchmarks.json --samples 5

      - name: Upload baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: quality-baseline-${{ matrix.os }}-${{ github.run_id }}
          path: target/quality
          if-no-files-found: warn

  docs-consistency:
    name: Documentation Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check documentation, examples, and schema
        run: python3 tools/quality/docs_consistency.py --output target/quality/docs-consistency.json

      - name: Upload documentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: docs-consistency-${{ github.run_id }}
          path: target/quality/docs-consistency.json
          if-no-files-found: warn

  release-contracts:
    name: Release Governance Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run release policy and inventory contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tools/release/tests -v
          bash tools/release/tests/test_install.sh

  quality-required:
    name: Required Quality Aggregate
    if: ${{ always() }}
    needs: [quality-coverage, quality-contracts, quality-baseline, docs-consistency, release-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          QUALITY_COVERAGE: ${{ needs.quality-coverage.result }}
          QUALITY_CONTRACTS: ${{ needs.quality-contracts.result }}
          QUALITY_BASELINE: ${{ needs.quality-baseline.result }}
          DOCS_CONSISTENCY: ${{ needs.docs-consistency.result }}
          RELEASE_CONTRACTS: ${{ needs.release-contracts.result }}
        run: |
          set -eu
          failed=0
          for result in "$QUALITY_COVERAGE" "$QUALITY_CONTRACTS" "$QUALITY_BASELINE" "$DOCS_CONSISTENCY" "$RELEASE_CONTRACTS"; do
            echo "quality dependency result: $result"
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "one or more required quality jobs did not succeed" >&2
            exit 1
          fi
