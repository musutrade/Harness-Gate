name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: harness-gate
            asset_name: harness-gate-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: harness-gate
            asset_name: harness-gate-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: harness-gate
            asset_name: harness-gate-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: harness-gate.exe
            asset_name: harness-gate-windows-amd64.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --profile release-small --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          cp tools/harness-gate/target/${{ matrix.target }}/release-small/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.asset_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref }}
          overwrite: true

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --manifest-path tools/harness-gate/Cargo.toml --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
