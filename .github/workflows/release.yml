name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: harness-gate
            asset_name: harness-gate-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: harness-gate
            asset_name: harness-gate-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: harness-gate
            asset_name: harness-gate-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: harness-gate.exe
            asset_name: harness-gate-windows-amd64.exe

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --manifest-path tools/harness-gate/Cargo.toml --locked --profile release-small --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: cp tools/harness-gate/target/${{ matrix.target }}/release-small/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish signed release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Download release assets
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path tools/harness-gate/Cargo.toml --locked --format-version 1 > /tmp/harness-gate-cargo-metadata.json
          python tools/release/generate-sbom.py \
            --metadata /tmp/harness-gate-cargo-metadata.json \
            --lockfile tools/harness-gate/Cargo.lock \
            --output dist/harness-gate.sbom.cdx.json

      - name: Generate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum harness-gate-* > SHA256SUMS)

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign release metadata
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/harness-gate-* dist/SHA256SUMS; do
            case "$file" in
              *.sig|*.pem|*.crt) continue ;;
            esac
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.crt" \
              "$file"
          done

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          for file in dist/harness-gate-* dist/SHA256SUMS; do
            case "$file" in
              *.sig|*.pem|*.crt) continue ;;
            esac
            cosign verify-blob \
              --signature "${file}.sig" \
              --certificate "${file}.crt" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp 'https://github.com/musutrade/Harness-Gate/.github/workflows/release.yml@refs/tags/v.*' \
              "$file"
          done

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/harness-gate-*
            dist/SHA256SUMS

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" dist/*

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --manifest-path tools/harness-gate/Cargo.toml --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
