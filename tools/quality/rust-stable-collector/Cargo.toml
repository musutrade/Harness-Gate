[package]
name = "harness-gate-rust-stable-collector"
version = "0.1.0-candidate.1"
edition = "2021"
rust-version = "1.97.1"
publish = false
license = "MIT"

[dependencies]
gate-observation-generator = { path = "../fixtures/rust-macro-observation/generator" }
anyhow = "=1.0.104"
libc = "=0.2.189"
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
quote = "=1.0.45"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full", "visit"] }
tempfile = "=3.27.0"
toml = "=0.8.23"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[workspace]
