version = 2

[project]
name = "quality-benchmark"
default_profile = "full"
hook_profile = "full"

[paths]
reports = ".harness-gate/reports"
audit_config = ".harness-gate/audit.toml"
secrets_config = ".harness-gate/secrets.toml"

[scope]
unmatched = "all"
rules = [{ patterns = ["**"], components = ["project"] }]

[[steps]]
id = "benchmark.diff"
label = "benchmark diff"
component = "project"
profiles = ["full"]
program = "git"
args = ["diff", "--check"]
cwd = "{root}"
log = "benchmark_diff.log"
timeout_secs = 30

[[steps]]
id = "benchmark.status"
label = "benchmark status"
component = "project"
profiles = ["full"]
program = "git"
args = ["status", "--short"]
cwd = "{root}"
log = "benchmark_status.log"
timeout_secs = 30
