[package]
name = "harness-gate"
version = "0.2.0"
edition = "2021"
authors = ["Harness-Gate Contributors"]
description = "Configurable development workflow and architecture guard CLI"
readme = "../../README.md"
homepage = "https://github.com/musutrade/Harness-Gate"
repository = "https://github.com/musutrade/Harness-Gate"
license = "MIT"
keywords = ["workflow", "ci", "quality-gate", "lint", "testing"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
rayon = "1.12"
ignore = "0.4.33"
libc = "0.2"
regex = "1.13.1"
globset = "0.4.20"
clap = { version = "4.6", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
url = "2.5"

[dev-dependencies]
tempfile = "3.27"

[profile.dev]
# Cargo's dev defaults (incremental = true, codegen-units = 256, opt-level = 0) are
# already tuned for iteration: measured 1.1s incremental rebuild, 0.5s `cargo check`.
# Only debug info is dialed back - level 1 keeps line numbers for panic backtraces
# (the main diagnostic for test failures) while cutting a full build 19.5s -> 17.9s
# and target/debug 511 MB -> 425 MB.
debug = 1

[profile.release]
strip = true          # Remove debug symbols for smaller binary
lto = true            # Link-time optimization for better performance
codegen-units = 4     # 4 parallelizes this crate's codegen (79.31s -> 68.96s, -13.0%,
                      # measured back-to-back on one machine; binary 4.20 -> 4.39 MB).
                      # cu=16 regresses to 78.1s as fat LTO becomes the serial bottleneck
opt-level = 3         # Maximum optimization for speed (balanced with size)

[profile.release-small]
inherits = "release"
opt-level = "z"       # Optimize for size
panic = "abort"       # No unwinding support for smaller binary
codegen-units = 1     # Pinned back to 1: distribution builds trade compile time for size
                      # (cu=4 would inflate the binary 4.20 -> 4.39 MB via inherits)
