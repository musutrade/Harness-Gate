[package]
name = "harness-gate"
version = "0.1.0"
edition = "2021"
authors = ["Harness-Gate Contributors"]
description = "Configurable development workflow and architecture guard CLI"
readme = "../../README.md"
homepage = "https://github.com/musutrade/Harness-Gate"
repository = "https://github.com/musutrade/Harness-Gate"
license = "MIT"
keywords = ["workflow", "ci", "quality-gate", "lint", "testing"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
rayon = "1.12"
ignore = "0.4"
libc = "0.2"
regex = "1.13"
globset = "0.4"
clap = { version = "4.6", features = ["derive"] }
chrono = "0.4"
url = "2.5"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
strip = true          # Remove debug symbols for smaller binary
lto = true            # Link-time optimization for better performance
codegen-units = 1     # Better optimization at cost of compile time
